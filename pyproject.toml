[project]
name = "hik-video-download"
version = "0.1.0"
description = "PySide6 desktop client for searching and downloading Hikvision NVR recordings via ISAPI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
    "PySide6-Fluent-Widgets>=1.7",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
hik-video-download = "hik_video_download.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
